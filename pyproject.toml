[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kosa"
version = "0.1.0"
description = "Knowledge graph agent system for ML/AI research hypothesis generation"
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.0",
    "nano-graphrag>=0.0.1",
    "openai>=1.0",
    "numpy>=1.26",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "pre-commit>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/kosa/ingestion/corpus.py" = ["E501"]
"src/kosa/ingestion/prompts.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["kosa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
